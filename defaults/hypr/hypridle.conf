# Géré par Foyer. Mise en veille automatique (hypridle garde son propre format).
#
# Note : après 3 mots de passe faux, Arch bloque le compte 10 minutes ; pendant ce
# temps même le bon mot de passe est refusé (l'écran affiche alors la raison).
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 5 min : écran éteint
listener {
    timeout = 300
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 10 min : verrouillage
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 20 min : mise en veille
listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
