# Géré par Foyer. Mise en veille automatique (hypridle garde son propre format).
#
# Verrouillage automatique SUSPENDU : un mot de passe correct a été refusé par
# l'écran de verrouillage sur le L520. Tant que ce n'est pas résolu, l'écran
# s'éteint mais ne se verrouille pas tout seul (Super + L verrouille toujours).
general {
    lock_cmd = pidof hyprlock || hyprlock
}

# 5 min : écran éteint
listener {
    timeout = 300
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
