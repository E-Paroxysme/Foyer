# Géré par Foyer. Mise en veille automatique (hypridle garde son propre format).
general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
}

# 5 min : verrouillage
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 15 min : mise en veille
listener {
    timeout = 900
    on-timeout = systemctl suspend
}
