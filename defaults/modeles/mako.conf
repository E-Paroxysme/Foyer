# Géré par Foyer : produit par « foyer theme ».
# Notifications de secours : utilisées seulement si la pastille ne démarre pas.
anchor=bottom-center
margin=24
width=420
padding=14
border-size=2
border-radius=@@arrondis.carte@@
font=@@police.interface@@ 11
background-color=#@@couleurs.panneau.nu@@ee
text-color=#@@couleurs.texte.nu@@
border-color=#@@couleurs.accent.nu@@
default-timeout=6000
max-visible=3

[urgency=critical]
border-color=#@@couleurs.danger.nu@@
default-timeout=0
