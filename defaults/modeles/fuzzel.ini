# Géré par Foyer : produit par « foyer theme » (lanceur de secours, Super + Espace).
[main]
font=@@police.interface@@:size=13
prompt="  "
terminal=foot
width=40
lines=10
horizontal-pad=24
vertical-pad=16
inner-pad=8

[colors]
background=@@couleurs.panneau.nu@@f0
text=@@couleurs.texte.nu@@ff
match=@@couleurs.accent.nu@@ff
selection=ffffff22
selection-text=@@couleurs.texte.nu@@ff
selection-match=@@couleurs.accentClair.nu@@ff
border=@@couleurs.accent.nu@@ff

[border]
width=2
radius=@@arrondis.carte@@
