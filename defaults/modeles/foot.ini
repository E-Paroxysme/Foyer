# Géré par Foyer : produit par « foyer theme » à partir du thème (ne pas modifier).
[main]
font=@@police.mono@@:size=@@police.taille@@
pad=14x12

# Barre de titre : dessinée par Hyprland (extension hyprbars), comme pour toutes
# les fenêtres ; tant que l'extension n'est pas active, foot dessine la sienne.
[csd]
preferred=@@fenetres.decorationsTerminal@@
size=30
font=@@police.interface@@:size=10
color=ff@@couleurs.panneau.nu@@
hide-when-maximized=yes
border-width=0
button-width=34
button-color=ff@@couleurs.texte.nu@@
button-minimize-color=ff2d2420
button-maximize-color=ff2d2420
button-close-color=ff@@couleurs.accent.nu@@

[colors-dark]
alpha=@@transparence.terminal@@
# Curseur : « couleur du texte sous le curseur » puis « couleur du curseur ».
cursor=@@couleurs.fondTerminal.nu@@ @@couleurs.accent.nu@@
background=@@couleurs.fondTerminal.nu@@
foreground=@@couleurs.texte.nu@@
selection-background=@@couleurs.accentFonce.nu@@
selection-foreground=@@couleurs.texte.nu@@
regular0=2a2420
regular1=@@couleurs.danger.nu@@
regular2=@@couleurs.succes.nu@@
regular3=@@couleurs.accentClair.nu@@
regular4=8fa8c8
regular5=c79ac0
regular6=8fc3bd
regular7=d9d2cb
bright0=5a514b
bright1=f07a6e
bright2=a8d4a3
bright3=f9d39e
bright4=a9c0de
bright5=dbb2d4
bright6=a7d8d2
bright7=@@couleurs.texte.nu@@
