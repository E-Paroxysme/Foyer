# Géré par Foyer : produit par « foyer theme » (ne pas modifier).
# Fond : image générée à partir de ton fond d'écran, avec l'icône du compte
# (~/.face si elle existe, sinon le rond aux couleurs du thème) à moitié floutée.
general {
    hide_cursor = true
}

background {
    monitor =
    path = @@verrou.image@@
    color = rgb(@@couleurs.panneau.nu@@)
}

# Heure et date, en haut à gauche
label {
    monitor =
    text = $TIME
    font_size = 64
    font_family = @@police.interface@@ Light
    color = rgb(@@couleurs.texte.nu@@)
    position = 64, -48
    halign = left
    valign = top
}
label {
    monitor =
    text = cmd[update:60000] LC_TIME=fr_FR.UTF-8 date +"%A %-d %B"
    font_size = 15
    font_family = @@police.interface@@
    color = rgba(@@couleurs.texte.nu@@aa)
    position = 66, -140
    halign = left
    valign = top
}

# Nom du compte, en bas à droite
label {
    monitor =
    text = @@verrou.nom@@
    font_size = 22
    font_family = @@police.interface@@ Medium
    color = rgb(@@couleurs.texte.nu@@)
    position = -56, 80
    halign = right
    valign = bottom
}
label {
    monitor =
    text = Tape ton mot de passe · clavier $LAYOUT
    font_size = 13
    font_family = @@police.interface@@
    color = rgba(@@couleurs.texte.nu@@bb)
    position = -56, 52
    halign = right
    valign = bottom
}

# Champ du mot de passe : invisible tant qu'on ne tape rien
input-field {
    monitor =
    size = 200, 34
    rounding = -1
    outline_thickness = 1
    outer_color = rgb(@@couleurs.accent.nu@@)
    inner_color = rgba(ffffff14)
    font_family = @@police.interface@@
    font_color = rgb(@@couleurs.texte.nu@@)
    check_color = rgb(@@couleurs.accentClair.nu@@)
    fail_color = rgb(@@couleurs.danger.nu@@)
    fade_on_empty = true
    fade_timeout = 1500
    placeholder_text =
    # $FAIL donne la raison exacte renvoyée par le système (utile au diagnostic).
    fail_text = $FAIL
    dots_size = 0.22
    dots_spacing = 0.5
    position = 0, -300
    halign = center
    valign = center
}
