# Géré par Foyer : égaliseur du lecteur de musique (lu par le hub).
[general]
bars = @@eco.barres@@
framerate = @@eco.images@@
autosens = 1

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
